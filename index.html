<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математическая игра для 5 класса</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-calculator"></i> Математическая игра для 5 класса</h1>
        <div class="subtitle">Проверь свои знания по математике!</div>
    </header>
    
    <div class="container">
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">ТЕМА</div>
                <div class="info-value" id="current-topic">Выберите тему</div>
            </div>
            <div class="info-item">
                <div class="info-label">БАЛЛЫ</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">ВОПРОС</div>
                <div class="info-value" id="question-count">0/10</div>
            </div>
            <div class="info-item">
                <div class="info-label">УРОВЕНЬ</div>
                <div class="info-value" id="level">1</div>
            </div>
        </div>
        
        <div class="section active-section" id="topic-section">
            <h2><i class="fas fa-book-open"></i> Выбери тему:</h2>
            <div class="topic-buttons">
                <button class="topic-btn active" data-topic="fractions">
                    <i class="fas fa-divide"></i> Сложение и вычитание дробей
                </button>
                <button class="topic-btn" data-topic="comparison">
                    <i class="fas fa-balance-scale"></i> Сравнение дробей
                </button>
                <button class="topic-btn" data-topic="brackets">
                    <i class="fas fa-brackets-curly"></i> Раскрытие скобок
                </button>
                <button class="topic-btn" data-topic="equations">
                    <i class="fas fa-equals"></i> Уравнения
                </button>
                <button class="topic-btn" data-topic="history">
                    <i class="fas fa-history"></i> История математики
                </button>
            </div>
            <div class="controls">
                <button class="control-btn" id="start-game">
                    <i class="fas fa-play"></i> Начать игру
                </button>
            </div>
        </div>
        
        <div class="section" id="game-section">
            <div class="question-container">
                <div class="question" id="question-text">Здесь будет вопрос</div>
                <div class="answers" id="answers-container">
                    <!-- Ответы будут добавляться через JavaScript -->
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="controls">
                <button class="control-btn" id="hint-btn">
                    <i class="fas fa-lightbulb"></i> Подсказка
                </button>
                <button class="control-btn" id="next-btn" disabled>
                    <i class="fas fa-arrow-right"></i> Следующий вопрос
                </button>
            </div>
        </div>
        
        <div class="section" id="result-section">
            <div class="result" id="result-container">
                <h3><i class="fas fa-trophy"></i> Игра завершена!</h3>
                <p><i class="fas fa-book"></i> Тема: <span id="result-topic"></span></p>
                <p><i class="fas fa-star"></i> Твой результат: <span id="result-score">0</span> баллов</p>
                <p><i class="fas fa-check-circle"></i> Правильных ответов: <span id="correct-answers">0</span> из 10</p>
                <p id="result-message">Здесь будет результат</p>
                <div class="controls">
                    <button class="control-btn" id="restart-btn">
                        <i class="fas fa-redo"></i> Играть снова
                    </button>
                    <button class="control-btn" id="change-topic-btn">
                        <i class="fas fa-exchange-alt"></i> Выбрать другую тему
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
